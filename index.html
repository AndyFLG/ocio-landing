<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ÓCIO — O tempo que não se mede em produtividade, mas em memórias.">
  <meta property="og:title" content="ÓCIO">
  <meta property="og:description" content="ÓCIO — O tempo que não se mede em produtividade, mas em memórias.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ocio.pt/">
  <meta name="twitter:card" content="summary_large_image">
  <title>ÓCIO</title>

  <style>
    @font-face {
      font-family: 'Cormorant Garamond';
      src: url('fonts/cormorant-light.woff2') format('woff2');
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Cormorant Garamond';
      src: url('fonts/cormorant-regular.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Cormorant Garamond';
      src: url('fonts/cormorant-medium.woff2') format('woff2');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Greycliff CF';
      src: url('fonts/greycliff-regular.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Greycliff CF';
      src: url('fonts/greycliff-medium.woff2') format('woff2');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Greycliff CF';
      src: url('fonts/greycliff-demibold.woff2') format('woff2');
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }

    :root {
      --papel: #F4F1EA;
      --creme: #E5D4C0;
      --areia: #D2BC9E;
      --verde-seco: #5A6255;
      --terra: #3E3527;
      --tinta: #1C1714;
      --ambar: #C58242;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: 'Greycliff CF', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(180deg, var(--papel) 0%, var(--creme) 55%, var(--areia) 100%);
      color: var(--tinta);
      line-height: 1.6;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      opacity: 0.12;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 128px 128px;
    }

    .page {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: clamp(60px, 12vh, 100px) clamp(24px, 5vw, 40px);
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      min-height: 60vh;
      gap: clamp(24px, 4vh, 36px);
    }

    .wordmark {
      display: block;
      max-width: 320px;
      width: 100%;
      height: auto;
      margin: 0 auto;
      opacity: 0.9;
    }

    .enter-link {
      font-family: 'Greycliff CF', inherit;
      font-size: clamp(13px, 2.5vw, 15px);
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--tinta);
      opacity: 0.65;
      transition: opacity 0.25s ease, color 0.25s ease;
      position: relative;
    }
    .enter-link::after {
      content: "";
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 100%;
      height: 1px;
      background: currentColor;
      transform: scaleX(0);
      transform-origin: right;
      transition: transform 0.3s ease;
    }
    .enter-link:hover,
    .enter-link:focus {
      opacity: 1;
      color: var(--ambar);
      outline: none;
    }
    .enter-link:hover::after,
    .enter-link:focus::after {
      transform: scaleX(1);
      transform-origin: left;
    }
    .enter-link:focus-visible {
      outline: 2px solid var(--verde-seco);
      outline-offset: 4px;
    }

    .footer {
      margin-top: auto;
      padding-top: clamp(32px, 6vh, 48px);
      text-align: center;
      border-top: 1px solid var(--areia);
      opacity: 0.4;
    }
    .footer-links {
      display: flex;
      justify-content: center;
      gap: clamp(20px, 4vw, 40px);
      font-family: 'Greycliff CF', inherit;
      font-size: clamp(11px, 2vw, 12px);
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--verde-seco);
    }
    .footer-links a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s, color 0.2s;
    }
    .footer-links a:hover {
      border-bottom-color: currentColor;
      color: var(--terra);
    }

    @media (prefers-reduced-motion: reduce) {
      .enter-link { transition: none; }
      .enter-link::after { transition: none; }
      .footer-links a { transition: none; }
    }

    @media print {
      body::before { display: none; }
      body { background: var(--papel) !important; }
      .enter-link { color: var(--tinta); opacity: 1; }
      .enter-link::after { display: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <main class="content">
      <img class="wordmark" src="ocio-logo-black.svg" alt="ÓCIO" width="280" height="auto" loading="eager">
      <a class="enter-link" href="https://linktr.ee/ocio_pt" target="_blank" rel="noopener noreferrer" aria-label="Entrar no ÓCIO">
        ENTRAR
      </a>
    </main>
    <footer class="footer">
      <nav class="footer-links" aria-label="Redes e site">
        <a href="https://instagram.com/ocio_pt" target="_blank" rel="noopener noreferrer">@ocio_pt</a>
        <span aria-hidden="true" style="color: var(--areia);">·</span>
        <a href="https://ocio.pt">www.ocio.pt</a>
      </nav>
    </footer>
  </div>
</body>
</html>
